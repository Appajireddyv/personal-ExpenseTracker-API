<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Expenzo{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0C0C0F;
      --surface: #141418;
      --surface2: #1C1C22;
      --border: #2A2A35;
      --accent: #C8FF00;
      --accent2: #FF6B6B;
      --text: #F0F0F5;
      --muted: #7A7A90;
      --font-head: 'Syne', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* NAVBAR */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-logo {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: -0.02em;
      color: var(--accent);
      text-decoration: none;
    }

    .nav-logo span { color: var(--text); }

    .nav-links { display: flex; gap: 1rem; align-items: center; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1.1rem;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.18s ease;
      letter-spacing: 0.02em;
    }

    .btn-primary {
      background: var(--accent);
      color: #0C0C0F;
      font-weight: 700;
    }

    .btn-primary:hover { background: #d4ff33; transform: translateY(-1px); }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover { color: var(--text); border-color: var(--muted); }

    .btn-danger {
      background: transparent;
      color: var(--accent2);
      border: 1px solid var(--accent2);
    }

    .btn-danger:hover { background: var(--accent2); color: white; }

    /* LAYOUT */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* MESSAGES */
    .messages { margin-bottom: 1.5rem; }

    .message {
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
      border-left: 3px solid var(--accent);
      background: rgba(200, 255, 0, 0.06);
      color: var(--accent);
    }

    /* PAGE HEADER */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
    }

    .page-title {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 2rem;
      letter-spacing: -0.03em;
    }

    /* CARDS */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .card-title {
      font-family: var(--font-head);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 0.6rem;
    }

    /* STAT CARDS */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
    }

    .stat-value {
      font-family: var(--font-head);
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 0.3rem;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* CHART AREA */
    .charts-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .chart-wrap {
      position: relative;
      height: 220px;
    }

    /* EXPENSE TABLE */
    .expense-list { list-style: none; }

    .expense-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    .expense-item:last-child { border-bottom: none; }
    .expense-item:hover { background: var(--surface2); border-radius: 8px; }

    .expense-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .expense-info { flex: 1; min-width: 0; }

    .expense-title {
      font-family: var(--font-head);
      font-weight: 600;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .expense-meta {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }

    .expense-amount {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 1rem;
      color: var(--text);
      white-space: nowrap;
    }

    .expense-actions {
      display: flex;
      gap: 0.4rem;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .expense-item:hover .expense-actions { opacity: 1; }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 4px;
      text-decoration: none;
      transition: all 0.15s;
    }

    .icon-btn:hover { background: var(--border); color: var(--text); }
    .icon-btn.del:hover { background: rgba(255,107,107,0.15); color: var(--accent2); }

    /* FILTERS */
    .filters {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .filter-select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      cursor: pointer;
    }

    .filter-select:focus { outline: none; border-color: var(--accent); }

    /* FORM STYLES */
    .form-grid {
      display: grid;
      gap: 1.25rem;
    }

    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }

    .form-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      font-weight: 500;
    }

    .form-input, .form-select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 0.875rem;
      transition: border-color 0.15s;
      width: 100%;
    }

    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(200,255,0,0.08);
    }

    .form-input::placeholder { color: var(--muted); }

    textarea.form-input { resize: vertical; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
    }

    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty-state p { font-size: 0.875rem; }

    @media (max-width: 768px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .charts-grid { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
      .container { padding: 1rem; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">Expen<span>zo</span></a>
  <div class="nav-links">
    <a href="/" class="btn btn-ghost">Dashboard</a>
    <a href="/add/" class="btn btn-primary">+ Add Expense</a>
  </div>
</nav>

<div class="container">
  {% if messages %}
  <div class="messages">
    {% for message in messages %}
    <div class="message">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}

  {% block content %}{% endblock %}
</div>

</body>
</html>
